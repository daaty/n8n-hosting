version: '3.8'

volumes:
  db_storage:
  n8n_storage:

networks:
  n8n-network:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sua_senha_forte_123}
      POSTGRES_DB: n8n
    volumes:
      - db_storage:/var/lib/postgresql/data
    networks:
      - n8n-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U n8n_user -d n8n']
      interval: 10s
      timeout: 5s
      retries: 5
    # Configurações otimizadas para PostgreSQL
    command: >
      postgres -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      # Database Configuration
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-sua_senha_forte_123}
      
      # Authentication
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_AUTH_PASSWORD:-sua_senha_admin_123}
      
      # General Settings
      WEBHOOK_URL: ${WEBHOOK_URL:-https://n8n.seudominio.com}
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_LOG_LEVEL: info
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      
      # Binary Data
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_PERSIST_BINARY_DATA_TTL: 1440
      
      # Security & Performance
      N8N_SECURE_COOKIE: "false"
      N8N_DISABLE_UI: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-your-encryption-key-here}
      
      # Executions
      EXECUTIONS_TIMEOUT: 3600
      EXECUTIONS_TIMEOUT_MAX: 3600
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_MAX_AGE: 336
      
      # Puppeteer/Playwright
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      PLAYWRIGHT_BROWSERS_PATH: /home/node/.cache/playwright
      
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-network
    
    # Configurações de recursos para Easypanel
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    
    # Health check personalizado
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
