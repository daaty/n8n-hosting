version: '3.8'

volumes:
  db_storage:
  n8n_storage:

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sua_senha_forte_123}
      POSTGRES_DB: n8n
    volumes:
      - db_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U n8n_user -d n8n']
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: always
    user: root
    environment:
      # Database Configuration
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-sua_senha_forte_123}
      
      # Authentication
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_AUTH_PASSWORD:-sua_senha_admin_123}
      
      # General Settings
      WEBHOOK_URL: ${WEBHOOK_URL:-https://n8n.seudominio.com}
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_LOG_LEVEL: info
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      
      # Puppeteer/Playwright
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Installing system dependencies...' &&
        apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont python3 py3-pip build-base postgresql-dev git &&
        echo 'Installing Node.js packages...' &&
        npm install -g --no-audit --no-fund puppeteer@latest playwright@latest @playwright/test@latest pg@latest pgvector@latest &&
        echo 'Installing Playwright browsers...' &&
        npx playwright install chromium &&
        echo 'Setting up directories...' &&
        mkdir -p /home/node/.n8n /home/node/.cache/playwright &&
        chown -R node:node /home/node/.n8n /home/node/.cache &&
        echo 'Switching to node user and starting n8n...' &&
        su node -c 'n8n start'
      "
